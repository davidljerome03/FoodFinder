version: '3.8'

services:
  # PostgreSQL with PostGIS extension for geographic queries
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: foodfinder
      POSTGRES_PASSWORD: foodfinder_secret_password
      POSTGRES_DB: foodfinder
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build: ./backend
    ports:
      - "8080:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: always

  # Nginx serving React Frontend & Reverse Proxying to Backend
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgis_data:
