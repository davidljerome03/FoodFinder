<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Food Finder Official Tab Logo -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2E35" />
      <stop offset="100%" stop-color="#121D22" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A" />
      <stop offset="100%" stop-color="#FF4721" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Neo-brutalist rounded container -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="110" fill="none" stroke="#FF5A36" stroke-width="14" stroke-opacity="0.55" />

  <!-- Food Finder Location Pin -->
  <g filter="url(#dropShadow)">
    <path
      d="M256 56 C168 56 96 128 96 216 C96 326 238 448 250 458 C253.6 461 258.4 461 262 458 C274 448 416 326 416 216 C416 128 344 56 256 56 Z"
      fill="url(#pinGrad)"
    />
  </g>

  <!-- Inner Plate (Dark Navy with Rim Accent) -->
  <circle cx="256" cy="216" r="104" fill="#1C2E35" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />
  <circle cx="256" cy="216" r="90" fill="#142127" />

  <!-- Fork (Left) -->
  <path
    d="M208 144 L208 184 C208 198 217 210 223 213 L223 278 C223 282 226 286 230 286 C234 286 237 282 237 278 L237 213 C243 210 252 198 252 184 L252 144 C252 141.5 249.5 140 247 140 C244.5 140 243 141.5 243 144 L243 180 C243 184 240 187 236.5 187 C233 187 230.5 184 230.5 180 L230.5 144 C230.5 141.5 228.5 140 226 140 C223.5 140 221.5 141.5 221.5 144 L221.5 180 C221.5 184 219 187 215.5 187 C212 187 209 184 209 180 Z"
    fill="#FFFFFF"
  />

  <!-- Knife (Right) -->
  <path
    d="M280 140 C277 140 275 142.5 275 145.5 L275 278 C275 282 278 286 282 286 C286 286 289 282 289 278 L289 217 C298 213 303 201 303 188 C303 162 293 140 280 140 Z"
    fill="#FFFFFF"
  />
</svg>